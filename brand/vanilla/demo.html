<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aperture mark</title>
  <link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="aperture.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <main class="demo">
    <header class="demo-head">
      <span class="imu-wordmark" id="lockup"><span><span class="r">I</span>mu<span class="r">T</span><span class="s">echz</span></span></span>
      <button type="button" id="replay">Replay landing intro</button>
    </header>

    <section class="imu-rise">
      <h1>The Aperture</h1>
      <p>Six blades of one superformula curve around a red pupil. Live marks breathe on golden-ratio frequencies and stay in step on one shared clock.</p>
    </section>

    <section class="imu-rise rise-1">
      <h2>Sizes used on the website</h2>
      <div class="row" id="sizes"></div>
    </section>

    <section class="imu-rise rise-2">
      <h2>Static icon (rest frame), mono, reversed</h2>
      <div class="row">
        <figure><img src="../svg/aperture.svg" width="96" height="96" alt="Aperture icon"><figcaption>aperture.svg</figcaption></figure>
        <figure><img src="../svg/aperture-mono.svg" width="96" height="96" alt="Aperture icon, mono"><figcaption>aperture-mono.svg</figcaption></figure>
        <figure class="dark"><img src="../svg/aperture-reversed.svg" width="96" height="96" alt="Aperture icon, reversed"><figcaption>aperture-reversed.svg</figcaption></figure>
      </div>
    </section>
  </main>
  <script src="aperture.js"></script>
  <script src="demo.js"></script>
</body>
</html>
