[build-system]
# setup.py holds only the build glue (bundling the app + engine into the
# wheel); every piece of metadata is here.
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "imurun"
# Single source of truth for the version: imurun.__version__ reads it (from
# this file in a checkout, from the wheel metadata when installed), and
# package.json must carry the same value (CI checks it on release).
version = "0.3.3"
description = "Local-first AI chat with its own C++ inference engine (FISH): one process, no cloud"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ImuTechz", email = "dev@imutechz.in"}]
requires-python = ">=3.11"
keywords = ["llm", "local-ai", "gguf", "chat", "inference", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Keep in sync with requirements.txt and REQUIRED_MODULES in install.py.
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "huggingface_hub>=0.23",
    "pyyaml>=6.0",
    "truststore>=0.9",
]

[project.urls]
Homepage = "https://github.com/shubham001312/imurun"
Source = "https://github.com/shubham001312/imurun"
Issues = "https://github.com/shubham001312/imurun/issues"
Releases = "https://github.com/shubham001312/imurun/releases"

[project.optional-dependencies]
window = [
    "pywebview>=5.0",
]
connectors = [
    "keyring>=24.0",
]
metrics = [
    "psutil>=5.9",
]
api = [
    "fastapi>=0.110",
    "pydantic>=2.5",
]
# Server-side speech (services/voice): keep in sync with requirements-voice.txt.
voice = [
    "faster-whisper>=1.1",
    "av>=12",
    "piper-tts>=1.3",
    "numpy>=1.24",
]
all = [
    "imurun[window,connectors,metrics,api]",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
]
dev = [
    "imurun[test]",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
imurun = "imurun.cli:main"

[tool.setuptools]
# Only the launcher is a "real" package; setup.py's build_py copies the app
# (services/, model/*.py, start.py, frontend, engine) inside it.
packages = ["imurun"]
include-package-data = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["services", "model", "imurun", "tests"]
extend-exclude = ["archive", "model/fish", "build", "dist"]

[tool.ruff.lint]
# Aspirational style set; CI runs only the correctness subset
# (ruff check --select E9,F63,F7,F82), see .github/workflows/ci.yml.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PL",  # pylint
    "TRY", # tryceratops
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S106"]  # allow assert and hardcoded passwords in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "flaky: Flaky tests (with issue link)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["services", "model", "imurun"]
omit = [
    "*/test/*",
    "*/__pycache__/*",
    "*/.venv/*",
]
branch = true
parallel = true
concurrency = "multiprocessing"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  # directories
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | __pypackages__
)/
'''